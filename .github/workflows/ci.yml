name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The first build downloads CEF (~300 MB) and copies libcef.so next to the binary.
      - name: Build
        run: cargo build --release --locked

      # Unit tests only. The self-test (`--selftest`) needs a Wayland session with a GPU, so it is not run here.
      - name: Unit tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: cargo test --release --locked
