# browsah configuration: every option, with its default. All options are optional.
# Full documentation: docs/config/README.md

# Page opened in a new window (a URL on the command line takes priority).
home_page: https://duckduckgo.com/

# Search used when the address bar text is not a URL. {query} is replaced by the text.
search_url: https://duckduckgo.com/?q={query}

watch_config: true         # reload this file and the profile's file when they change
default_profile: work      # the selector opens web links in this profile without asking (omit to ask)

# URL routing rules for every profile (docs/config/routing.md); profiles and workspaces add their own.
routing:
  rules:
    - name: Meeting links open in the desktop client
      match: { scheme: [zoommtg] }
      open: system

window:
  width: 1280   # initial size in logical pixels
  height: 800

rendering:
  mode: accelerated        # accelerated (no copy) or readback (fallback, slower)
  frame_rate: 60           # maximum fps, 1 to 120; lower saves power on animated pages
  device_resolution: true  # render at physical resolution on HiDPI (false = blurry 1x)

chromium:
  flags: []                # extra Chromium switches, e.g. ["--disable-features=Foo"]

history:
  enabled: true            # remember visited pages and closed tabs
  retention_days: 365      # delete older history at start-up (0 keeps everything)
  exclude: []              # addresses never remembered, e.g. ["*.bank.example"]

input:
  wheel_notch: 100         # CSS px per mouse-wheel notch, 10 to 1000
  touchpad_acceleration: 0.025 # extra scaling for fast swipes, 0 to 1; 0 = linear
  touchpad_speed: 6.0      # touchpad scroll multiplier, 0.1 to 20; raise if scrolling feels slow

gpu:
  workarounds: true        # per-GPU environment fixes (AMD_DEBUG=nodcc on AMD)
