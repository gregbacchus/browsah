# browsah configuration: every option, with its default. All options are optional.
# Full documentation: docs/config/README.md

# Page opened in a new window (a URL on the command line takes priority).
home_page: https://duckduckgo.com/

# Search used when the address bar text is not a URL. {query} is replaced by the text.
search_url: https://duckduckgo.com/?q={query}

watch_config: true         # reload this file and the profile's file when they change
default_profile: work      # the profile used when none is named: the selector opens links there without asking (omit to ask), and `browsah workspace list` etc. assume it

# URL routing rules for every profile (docs/config/routing.md); profiles and workspaces add their own.
routing:
  unwrap_known: true        # unwrap the built-in redirectors (Google, Facebook, Outlook...); false turns the list off
  desktop_schemes: [claude]   # URL schemes any page may hand to the desktop's registered handler (starts that application; browsah does not open them); Claude Desktop's sign-in ends on claude://
  app_sign_in: ephemeral    # links from other applications that look like a sign-in they started; allow turns detection off
  rules:
    - name: Meeting links open in the desktop client
      match: { scheme: [zoommtg] }
      open: system
    - name: Sign-ins from other applications stay out of my workspaces
      match: { app_sign_in: true, kind: [external] }   # kind: external | link | typed
      open: ephemeral
    - name: Links clicked in the mail workspace
      match: { from: ["workspace:mail"], url: ["docs.example.com"] }   # from: external | ephemeral | workspace:<id> | app:<id>
      open: workspace:docs       # allow | block | ephemeral | modal | system | workspace:<id> | app:<id> (a web app) | profile:<id>

theme: system             # system | light | dark: the colour scheme web pages see (prefers-color-scheme); system follows the desktop
storage: shared           # shared | isolated: whether a workspace keeps its cookies and site data apart (set it in workspace.yaml)
new_tab_page: null         # what a new tab opens: null (blank, address bar ready), home, or an address
sleep_tabs_after: null       # put background tabs to sleep after this idle time (30m, 2h...); null is off; also per profile, workspace or app
workspace_picker: true    # the workspace list button at the start of the header (never in a web app); false hides it, also per profile or workspace
tab_min_width: null       # 40 to 1000 (px) or null (130): the narrowest a tab gets before the strip scrolls; below 72 a tab shows only its icon; also per profile, workspace or app

window:
  width: 1280   # initial size in logical pixels
  height: 800
  frame:                # the window's colour as a border around the page (needs a profile or workspace colour)
    enabled: true
    thickness: 4        # logical pixels, 0 to 40
    radius: 11          # the page's corner radius inside the border (close to the window's corner radius minus the thickness keeps the border looking even round the corners)

split:                   # a split tab (two panes side by side): how the pane without the focus looks; also per profile, workspace or app
  inactive:
    dim: 0.2               # 0 to 1: fade towards the window colour
    saturation: 0.8        # 0 to 4: 1 unchanged, 0 greyscale
    lightness: 1.0         # 0 to 4: brightness, 0.8 darker
    hue_shift: 0           # -360 to 360 degrees
    fade_ms: 150           # how long the change takes (0: at once)

rendering:
  mode: accelerated        # accelerated (no copy) or readback (fallback, slower)
  frame_rate: 60           # maximum fps, 1 to 120; lower saves power on animated pages
  device_resolution: true  # render at physical resolution on HiDPI (false = blurry 1x)

chromium:
  flags: []                # extra Chromium switches, e.g. ["--disable-features=Foo"]

history:
  enabled: true            # remember visited pages and closed tabs
  retention_days: 365      # delete older history at start-up (0 keeps everything)
  suggest: true            # offer bookmarks, tabs and history while typing an address
  exclude: []              # addresses never remembered, e.g. ["*.bank.example"]

permissions:                # what pages may do: allow, deny or ask (docs/config/permissions.md)
  default: ask              # for any kind with no setting of its own
  camera: ask               # each kind: allow | deny | ask (default: the `default` above)
  microphone: ask
  location: deny
  notifications: ask
  clipboard: ask            # reading the clipboard
  screen: ask               # sharing the screen or a window
  midi: deny
  sites:                    # per-site rules, first match that says something about a kind wins
    - match: ["meet.example.com", "*.zoom.us", "teams.microsoft.com", "teams.live.com"]   # exact hosts; *.x does not cover x
      default: ask          # any kind this rule does not name
      camera: allow
      microphone: allow
      screen: allow
    - match: ["maps.example.com"]
      location: allow
    - match: ["chat.example.com"]
      notifications: allow
    - match: ["docs.example.com"]
      clipboard: allow
    - match: ["studio.example.com"]
      midi: allow

downloads:
  directory: ~/Downloads    # where files go (omit for your Downloads folder)
  ask: false                # ask where to save each file

cookies:
  default: allow            # allow | session | deny for sites no rule covers
  rules:                    # first matching rule decides
    - match: ["tracker.example.com", "*.ads.example"]
      action: deny
    - match: ["news.example.com"]
      action: session       # cookies work, but are forgotten when the window closes

input:
  wheel_notch: 100         # CSS px per mouse-wheel notch, 10 to 1000
  touchpad_acceleration: 0.025 # extra scaling for fast swipes, 0 to 1; 0 = linear
  touchpad_speed: 6.0      # touchpad scroll multiplier, 0.1 to 20; raise if scrolling feels slow

sweep:                      # tidy up tabs that are not used (docs/config/sweep.md); a profile or workspace can set its own, and inherits this
  enabled: false
  interval: 5m              # how often to check, 30s to 1d
  rules:
    - name: Stale searches
      match: { url: ["*.google.com/search*"] }
      idle_for: 1h          # not used for an hour
      action: close         # close (default) | discard
    - name: Rarely used
      idle_for: 7d
      score_below: 0.5      # and not used much before that either
      half_life: 1d         # how fast use is forgotten for the score
      action: discard

sleeping_tabs:
  opacity: 0.6              # 0.2 to 1: how opaque a sleeping tab is in the tab strip (1 leaves it undimmed)
  grayscale_icon: true      # show a sleeping tab's icon without colour

context_menu:
  developer: true           # View page source and Inspect in the right-click menu
  links_in_background: true # "Open in new tab" leaves the current page selected
  image_search_url: null    # "Search for this image": an address with {url}, e.g. "https://lens.google.com/uploadbyurl?url={url}"; null leaves it out
  hide: []                  # menu items to leave out, by id (docs/config/context-menu.md)

recently_swept:
  enabled: true             # a broom button next to reload lists tabs a sweep closed lately, to restore them
  within: 1d                # how far back they are listed (30m, 6h, 1d)
  max_tabs: 10              # 1 to 50

logging:                    # the system journal (journalctl -t browsah, or browsah log); applies at the next start
  level: info               # error | warn | info | debug (debug adds why sweeping kept each tab)

print:
  paper: a4                 # a4 | letter
  backgrounds: true         # print background colours and images

extensions:                 # Chrome extensions (docs/config/extensions.md); applies at the next start
  paths: []                 # extra unpacked extension folders to load, e.g. ["~/src/my-extension"] (installed ones load without being listed)
  disable: []               # ids of installed extensions not to load
  native_hosts: true        # copy the native messaging hosts an extension needs (1Password) from Chrome's/Chromium's folders
  hide: []                  # a workspace window shows every extension's button except these ids (this applies per window, live)
  show: []                  # a web app's window shows no extension's button except these ids

gpu:
  workarounds: true        # per-GPU environment fixes (AMD_DEBUG=nodcc on AMD, INTEL_DEBUG=noccs on Intel)
