# A workspace's configuration:
# ~/.local/share/browsah/profiles/<profile>/workspaces/<id>/workspace.yaml
# Created for you by `browsah workspace add`; every option and its meaning: docs/config/workspace.md

name: Mail                  # shown in the window title
color:                      # accent colour for light and dark appearance
  light: "#2a6f97"
  dark: "#61a5c2"

nav:                        # which controls the window shows
  back: true                # the back button and Alt+Left
  reload: true              # the reload and stop buttons
  tab_bar: true             # false for a window with a single pinned tab
  address_bar: readonly     # editable (default), readonly or hidden
  forward: false
  new_tab_button: false
  bookmarks_bar: true       # star button, Ctrl+D, and a bar of this workspace's bookmarks
tabs:
  allow_new: false          # tabs only arrive by being sent here
  popups: modal             # sized popups (sign-in windows) open as a modal: tab (default), modal or block
  pinned:                   # always present, first, cannot be closed
    - url: https://mail.example.com/
      title: Mail
      size: full          # icon and title, with no close button (default: icon)
      scope: ["mail.example.com", "accounts.example.com/signin/*"]   # navigation limits

modals:
  style: overlay            # overlay (default) or window

sweep:                      # tidy up tabs that are not used (docs/config/sweep.md)
  enabled: true
  interval: 5m              # how often to check
  rules:
    - name: Stale searches
      match: { url: ["*.google.com/search*"] }
      idle_for: 1h          # not used for an hour
      action: close
    - name: Rarely used
      idle_for: 7d
      score_below: 0.5      # and not used much before that either
      half_life: 1d
      action: discard       # keep the tab, free its page

# Rules for links clicked in this workspace's tabs (docs/config/routing.md); tried first.
routing:
  rules:
    - match: { url: ["docs.example.com"] }
      open: workspace:docs

# Any per-window option from docs/config/options.md can be overridden for this workspace. Process-
# wide ones (chromium, gpu, rendering.mode, rendering.device_resolution) cannot.
home_page: "https://mail.example.com/"
search_url: "https://www.bing.com/search?q={query}"
rendering:
  frame_rate: 30
