# A profile's configuration: ~/.local/share/browsah/profiles/<id>/profile.yaml
# Created for you by `browsah profile add`; every option and its meaning: docs/config/profile.md

name: Work                  # shown as "Browsah (Work)" and used for the icon's initial
color:                      # icon colour for light and dark appearance
  light: "#4a2f80"
  dark: "#7a56c2"
# color: "#4a2f80 #7a56c2"
default_workspace: mail     # opened by a plain start when no workspace was open last time

# Where links go (docs/config/routing.md). Tried before the application's rules.
routing:
  external: workspace:mail            # links from other applications with no rule
  rules:
    - name: Work chat
      match: { url: ["chat.example.com"] }
      open: workspace:mail
    - name: Banking in the personal profile
      match: { url: ["*.bank.example"], target: [new_tab] }
      open: profile:personal

# Any option from docs/config/options.md can be overridden for this profile. Maps merge, values and
# lists replace, and `key+:` appends to a list.
search_url: "https://www.google.com/search?q={query}"
input:
  touchpad_speed: 8.0
chromium:
  flags+: ["--force-dark-mode"]  # the same on one line (light then dark); one colour is used for both
