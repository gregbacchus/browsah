# A web app's configuration (one site in a window of its own, with its own icon and launcher entry):
# ~/.local/share/browsah/profiles/<profile>/apps/<id>/app.yaml
# Created for you by `browsah app add mail --url https://mail.example.com/`; every option and its meaning: docs/config/webapp.md

name: Mail
color: "#2a6f97 #61a5c2"          # the generated icon's colour when there is no icon file (else the profile's colour)

url: https://mail.example.com/inbox     # the page it opens on (required)
scope: ["mail.example.com", "accounts.example.com/signin/*"]   # where it may navigate (default: the url's site)
display: custom                         # standalone (just the page) | minimal (plus a read-only address) | browser | custom (the nav: below)
nav:                                    # controls shown with display: custom (as a workspace's nav:, without tabs and bookmarks, see docs); ignored otherwise
  back: true
  forward: false
  reload: true
  address_bar: readonly                 # editable | readonly | hidden
icon: icon.png                          # a file in this directory (default: a generated icon)
manifest_id: https://mail.example.com/  # the web manifest's id, when it was installed from one
multiple_windows: true                  # more than one window of the app (the launcher's "New Window"); default true
multiple_tabs: false                    # more than one tab in a window; default false
modals:
  style: overlay                        # how popups and viewed links show: overlay (over the window) | window

# Any option of config.yaml can follow, as in a workspace; for example this app keeps its cookies apart
# (by default an app shares the profile's cookies and sign-ins):
storage: isolated
# An app's window shows no extension buttons unless they are listed (not at all with storage: isolated, where no extension is loaded):
# extensions:
#   show: ["aeblfdkhhhdcdjpifhhbdiojplfjncoa"]
cookies:
  rules:
    - match: ["ads.example.net"]
      action: deny
