<!doctype html>
<meta charset="utf-8">
<title>caps: pending</title>
<script>
(async () => {
  const r = {};
  const t = async (name, f) => { try { r[name] = await Promise.race([f(), new Promise(res => setTimeout(() => res('timeout'), 4000))]); } catch (e) { r[name] = 'err:' + (e.name || e); } };
  r.secure = isSecureContext;
  await t('sw_register', async () => { const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; return 'ok:' + (reg.active ? reg.active.state : 'none'); });
  r.notification_api = typeof Notification !== 'undefined' ? Notification.permission : 'missing';
  await t('notification_request', async () => await Notification.requestPermission());
  r.push_api = 'PushManager' in window;
  await t('push_subscribe', async () => { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: new Uint8Array(65).fill(4)}); return 'subscribed'; });
  r.webauthn_api = typeof PublicKeyCredential !== 'undefined';
  await t('platform_authenticator', async () => await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  await t('conditional_mediation', async () => await PublicKeyCredential.isConditionalMediationAvailable());
  await t('credentials_create', async () => { await navigator.credentials.create({publicKey: {challenge: new Uint8Array(32), rp: {name: 'spike'}, user: {id: new Uint8Array(8), name: 'u', displayName: 'u'}, pubKeyCredParams: [{type: 'public-key', alg: -7}], timeout: 3000}}); return 'created'; });
  await t('background_sync', async () => 'SyncManager' in window);
  await t('persistent_storage', async () => await navigator.storage.persist());
  await t('geolocation', async () => await new Promise(res => navigator.geolocation.getCurrentPosition(() => res('ok'), e => res('err' + e.code), {timeout: 2000})));
  await t('media_devices', async () => { const d = await navigator.mediaDevices.enumerateDevices(); return d.length + ' devices'; });
  document.title = 'caps: ' + JSON.stringify(r);
})();
</script>
