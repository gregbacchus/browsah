[package]
name = "browsah"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "A custom web browser: a GTK4 shell around Chromium (CEF) windowless rendering, native Wayland"
repository = "https://github.com/gregbacchus/browsah"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
cef = "156.5.0"
gdk-wayland = { version = "0.11.5", package = "gdk4-wayland" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libc = "0.2.191"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# Reads a site's page and web manifest for `browsah app add`. The rustls provider is chosen here and certificates come from
# the system (no bundled root list), so the licences stay MIT/Apache-2.0/ISC.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
# Unpacks a downloaded extension (a CRX is a zip with a header). MIT licensed; deflate only.
zip = { version = "2", default-features = false, features = ["deflate"] }
# SHA-256 for extension ids and (later) the signature check of a downloaded extension; already in the tree through rustls.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
